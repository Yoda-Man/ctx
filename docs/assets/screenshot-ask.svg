<svg xmlns="http://www.w3.org/2000/svg" width="835" height="549" viewBox="0 0 835 549" role="img" aria-label="ctx ask">
<rect width="835" height="549" rx="10" fill="#0d1117"/>
<rect width="835" height="34" rx="10" fill="#161b22"/><rect y="24" width="835" height="10" fill="#161b22"/>
<circle cx="20" cy="17" r="6" fill="#ff5f57"/><circle cx="40" cy="17" r="6" fill="#febc2e"/><circle cx="60" cy="17" r="6" fill="#28c840"/>
<text x="417.5" y="22" text-anchor="middle" fill="#8b949e" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12">ctx ask</text>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" xml:space="preserve" style="white-space:pre">
<text x="22" y="56"><tspan fill="#7ee787" font-weight="700">$ </tspan><tspan fill="#ffffff" font-weight="700">ctx ask &quot;How does YodaMan decide where to keep its settings and database?&quot; -p core</tspan></text>
<text x="22" y="94"><tspan fill="#7d8590">Searching core...</tspan></text>
<text x="22" y="132"><tspan fill="#d7dde8">YodaMan decides where to keep its settings (`config.json`) and database (`yodaman.db`) base…</tspan></text>
<text x="22" y="170"><tspan fill="#d7dde8">## Default Locations</tspan></text>
<text x="22" y="208"><tspan fill="#d7dde8">By default, YodaMan stores data in per-user application data folders:</tspan></text>
<text x="22" y="246"><tspan fill="#d7dde8">| Platform | Default Location |</tspan></text>
<text x="22" y="265"><tspan fill="#d7dde8">|----------|------------------|</tspan></text>
<text x="22" y="284"><tspan fill="#d7dde8">| macOS    | `~/Library/Application Support/YodaMan` |</tspan></text>
<text x="22" y="303"><tspan fill="#d7dde8">| Windows  | `%APPDATA%\YodaMan` |</tspan></text>
<text x="22" y="322"><tspan fill="#d7dde8">| Linux    | `~/.config/YodaMan` |</tspan></text>
<text x="22" y="360"><tspan fill="#d7dde8">## Environment Variables for Customization</tspan></text>
<text x="22" y="379"><tspan fill="#7d8590">  ⋮</tspan></text>
<text x="22" y="417"><tspan fill="#d7dde8" font-weight="700">Sources:</tspan></text>
<text x="22" y="436"><tspan fill="#d7dde8">[1] CHANGELOG.md (1.00)</tspan></text>
<text x="22" y="455"><tspan fill="#d7dde8">[2] backend/infrastructure/DataPaths.js (0.88)</tspan></text>
<text x="22" y="474"><tspan fill="#d7dde8">[3] docs/guides/configuration.md (0.75)</tspan></text>
<text x="22" y="493"><tspan fill="#d7dde8">[4] README.md (0.50)</tspan></text>
<text x="22" y="512"><tspan fill="#d7dde8">[5] UPGRADING.md (0.63)</tspan></text>
</g></svg>
