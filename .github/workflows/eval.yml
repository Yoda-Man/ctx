name: Eval

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'src/search/**'
      - 'src/agent/**'
      - 'src/indexer/**'
      - 'src/eval/**'
      - 'fixtures/eval/**'
      - 'scripts/check-eval-thresholds.js'
      - 'scripts/run-ci-eval.ts'
  schedule:
    # Weekly Monday 6 AM UTC — catch regressions even without PRs
    - cron: '0 6 * * 1'
  workflow_dispatch:

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    name: Retrieval Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run fixture eval
        run: npx tsx scripts/run-ci-eval.ts > eval-results.json

      - name: Check quality thresholds
        if: success()
        run: node scripts/check-eval-thresholds.js eval-results.json

      - name: Report eval failure
        if: failure()
        run: |
          echo "::error::Eval pipeline failed. Check 'Run fixture eval' step for details."
          echo "Eval results artifact (if any) will be uploaded for debugging."

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-results
          path: eval-results.json
          retention-days: 7
